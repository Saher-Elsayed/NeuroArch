version: "3.9"
services:
  inference:
    build: .
    ports: ["8000:8000"]
    volumes: ["./snn/weights:/app/snn/weights:ro", "./data:/app/data:ro"]
    environment:
      - MODEL_PATH=snn/weights/best_model.pt
      - LOG_LEVEL=INFO
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  bim_server:
    build: .
    ports: ["8765:8765"]
    command: ["python", "-m", "bim_server.bim_server"]
    volumes: ["./bim_server/ifc_models:/app/bim_server/ifc_models:ro"]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    ports: ["9090:9090"]
    volumes: ["./deployment/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]

  grafana:
    image: grafana/grafana:latest
    ports: ["3000:3000"]
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=neuroarch
